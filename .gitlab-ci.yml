stages:
  - test
  - lint
  - security
  - build

test:
  stage: test
  image: golang:1.25-alpine
  script:
    - go mod download
    - go test ./...

lint:
  stage: lint
  image:
    name: golangci/golangci-lint:v2.13.2-alpine
    entrypoint: [""]
  script:
    - golangci-lint run

security:
  stage: security
  image: golang:1.25-alpine
  before_script:
    - apk add --no-cache git
    - go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8
  script:
    - $(go env GOPATH)/bin/gosec ./...

build:
  stage: build
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t health-check-api:$CI_COMMIT_SHORT_SHA .
