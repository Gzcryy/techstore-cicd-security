stages:
  - test
  - lint
  - security
  - build

test:
  stage: test
  image: golang:1.25-alpine
  script:
    - go mod download
    - go test ./...

lint:
  stage: lint
  image: golangci/golangci-lint:v2.13.2-alpine
  script:
    - golangci-lint run

security:
  stage: security
  image: securego/gosec:latest
  script:
    - gosec ./...

build:
  stage: build
  image: docker:cli
  services:
    - docker:dind
  script:
    - docker build -t health-check-api:$CI_COMMIT_SHORT_SHA .
